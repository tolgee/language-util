name: Test

on:
  push:

jobs:
  test:
    name: 'Test'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Eslint
        run: npm run eslint

      - name: Generate Language info
        run: npm run generateLanguageInfo

      - name: Generate flags
        run: npm run generateFlags

      - name: Test
        run: npm run test
